# Fails a pull request when any commit in it adds a file above the size limit,
# even if a later commit removes the file: a merge commit carries every blob of
# the branch into the history for good. Article fits go to the `article-fits`
# release instead (ADR 0003, #438).
# A blob that is reachable from the base or from develop is already in the
# protected history and passes, so renames and forward merges of files tracked
# before this check do not trip it.
on:
  pull_request:
    branches: [master, develop, 'dev-*']

name: file-size

jobs:
  file-size:
    runs-on: ubuntu-latest
    env:
      MAX_BYTES: 1048576
    steps:
      # fetch-depth 0 fetches all history of all branches and tags, so
      # origin/develop and the pull request commits are present; filter
      # blob:none leaves the blobs out, and the step below fetches the new
      # ones in a single request
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check the size of every blob the pull request adds
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          develop=refs/remotes/origin/develop
          git rev-parse --verify --quiet "$develop" > /dev/null ||
            git fetch --quiet --no-tags --filter=blob:none origin "+refs/heads/develop:$develop"
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            git cat-file -e "${sha}^{commit}" 2> /dev/null ||
              git fetch --quiet --no-tags --filter=blob:none origin "$sha"
          done
          range=("$HEAD_SHA" "^$BASE_SHA" "^$develop")

          listing=$(mktemp)
          git rev-list --objects --missing=print "${range[@]}" > "$listing"

          # One request for all blobs the clone lacks. Looked up one by one,
          # each blob arrives in its own pack, which takes about 0.4 s and
          # ends in a fatal error after about 50 packs.
          missing=$(mktemp)
          sed -n 's/^?//p' "$listing" > "$missing"
          if [ -s "$missing" ]; then
            git -c fetch.negotiationAlgorithm=noop fetch --quiet --no-tags \
              --no-write-fetch-head --filter=blob:none origin --stdin < "$missing"
          fi

          sizes=$(mktemp)
          sed 's/^?//; s/ .*//' "$listing" | sort -u |
            git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize)' > "$sizes"

          status=0
          checked=0
          while read -r type blob size; do
            [ "$type" = blob ] || continue
            checked=$((checked + 1))
            [ "$size" -gt "$MAX_BYTES" ] || continue
            where=$(git log -m --reverse --no-renames --raw --no-abbrev \
              --format='commit %h' --find-object="$blob" "${range[@]}" |
              awk -v b="$blob" '/^commit /{c=$2; next} /^:/ && $4==b && !done {split($0,a,"\t"); print c, a[2]; done=1}')
            commit=${where%% *}
            path=${where#* }
            [ -n "$where" ] || { commit="an unknown commit"; path="(path not found)"; }
            echo "::error file=${path}::${path} is ${size} bytes, above the limit of ${MAX_BYTES} (blob ${blob:0:10}, added in ${commit}). Upload article fits to the article-fits release instead of committing them, and drop the commit from the branch even if a later commit removes the file (see CONTRIBUTING)."
            status=1
          done < "$sizes"
          echo "Checked ${checked} blobs that the pull request adds to the history"
          exit "$status"
