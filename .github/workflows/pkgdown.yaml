# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:


name: pkgdown

jobs:
  pkgdown:
    # Creating the article-fits release publishes a release event that builds
    # the tagged commit and deploys it to gh-pages. That release only holds
    # fits, so its event builds nothing. Versioned releases deploy as before.
    if: github.event_name != 'release' || github.event.release.tag_name != 'article-fits'
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
            rmarkdown
            withr
            knitr
            posterior
            here
            stan-dev/cmdstanr
            rmarkdown
            bookdown
            tidybayes
            ggplot2
            mixtur
            ggthemes
            cowplot
            stringr
            remotes
            waldo
            fansi
            rtdists
            MPTinR
            any::pkgdown
            local::.

      # Cache the built CmdStan so it is only compiled when a new version is
      # released (the cache key includes the latest release version)
      - name: Get latest CmdStan release
        id: cmdstan-version
        shell: bash
        run: |
          set +e
          response=$(curl -sSL --fail \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
            https://api.github.com/repos/stan-dev/cmdstan/releases/latest)
          curl_status=$?
          set -e
          if [ $curl_status -ne 0 ]; then
            echo "Failed to reach the GitHub API (curl exit ${curl_status})" >&2
            exit 1
          fi
          tag=$(echo "$response" | jq -r '.tag_name // empty')
          if [ -z "$tag" ]; then
            echo "Failed to determine the latest CmdStan release" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Locate CmdStan install path
        id: cmdstan-path
        run: |
          cat(sprintf("path=%s\n", cmdstanr::cmdstan_default_install_path()),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.cmdstan-path.outputs.path }}
          key: cmdstan-${{ runner.os }}-${{ steps.cmdstan-version.outputs.version }}

      - name: Set up CmdStan toolchain
        run: cmdstanr::check_cmdstan_toolchain(fix = TRUE)
        shell: Rscript {0}

      - name: Build CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          cmdstanr::install_cmdstan(
            cores = parallel::detectCores(),
            version = "${{ steps.cmdstan-version.outputs.version }}"
          )
        shell: Rscript {0}

      # Fits added or refitted since ADR 0003 are assets of the article-fits
      # release, not tracked files (#438). Until that release exists the
      # articles read only the tracked fits; any other API error stops the
      # build, because a missing fit would be refitted during the build.
      - name: Download article fits
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FITS_TAG: article-fits
        run: |
          set -euo pipefail
          err=$(mktemp)
          if ! n=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${FITS_TAG}" --jq '.assets | length' 2> "$err"); then
            grep -q 'HTTP 404' "$err" || { cat "$err" >&2; exit 1; }
            n=0
          fi
          if [ "$n" -gt 0 ]; then
            gh release download "$FITS_TAG" --repo "$GITHUB_REPOSITORY" --dir vignettes/articles/fits --clobber
          fi
          echo "Downloaded ${n} article fits from the ${FITS_TAG} release"

      # Every article that loads a fit from fits/ must find it, because a
      # missing fit is refitted during the build instead of failing it. The
      # path must be a string literal, so that it can be listed here.
      - name: Check article fits
        shell: Rscript {0}
        run: |
          articles_dir <- "vignettes/articles"
          open_fence <- "^\\s*`{3,}\\s*\\{\\s*[rR]([ ,}]|$)"
          close_fence <- "^\\s*`{3,}\\s*$"
          fits_path <- "(^|/)fits(/|$)"

          chunks_of <- function(lines) {
            chunks <- list()
            first <- NULL
            for (i in seq_along(lines)) {
              if (is.null(first) && grepl(open_fence, lines[i])) {
                first <- i + 1L
              } else if (!is.null(first) && grepl(close_fence, lines[i])) {
                chunks[[length(chunks) + 1L]] <- list(first = first, code = if (i - 1L >= first) lines[first:(i - 1L)] else character())
                first <- NULL
              }
            }
            chunks
          }

          is_file_argument <- function(pd, id) {
            parent <- pd$parent[pd$id == id]
            siblings <- pd[pd$parent == parent, ]
            siblings <- siblings[order(siblings$line1, siblings$col1), ]
            at <- which(siblings$id == id)
            parent > 0 && at > 2L && sum(pd$parent == id) == 1L &&
              siblings$token[at - 1L] == "EQ_SUB" &&
              siblings$token[at - 2L] == "SYMBOL_SUB" && siblings$text[at - 2L] == "file"
          }

          references <- data.frame(article = character(), line = integer(), fit = character())
          problems <- data.frame(article = character(), line = integer(), message = character())
          note <- function(article, line, message) {
            problems[nrow(problems) + 1L, ] <<- list(article, line, gsub("[\r\n]+", " ", message))
          }

          articles <- list.files(articles_dir, pattern = "\\.[Rr]md$", full.names = TRUE)
          for (article in articles) {
            for (chunk in chunks_of(readLines(article, warn = FALSE, encoding = "UTF-8"))) {
              code <- paste(chunk$code, collapse = "\n")
              parsed <- tryCatch(parse(text = code, keep.source = TRUE, encoding = "UTF-8"), error = function(e) NULL)
              if (is.null(parsed)) {
                if (grepl("[\"']fits[/\"']", code)) {
                  note(article, chunk$first, "A code chunk that mentions fits/ cannot be parsed, so its fits cannot be checked.")
                }
                next
              }
              pd <- utils::getParseData(parsed)
              if (is.null(pd)) next
              for (k in which(pd$token == "STR_CONST")) {
                value <- tryCatch(str2lang(pd$text[k]), error = function(e) "")
                if (!is.character(value) || !grepl(fits_path, value)) next
                line <- chunk$first + pd$line1[k] - 1L
                if (is_file_argument(pd, pd$parent[k]) && grepl("^fits/.+", value)) {
                  references[nrow(references) + 1L, ] <- list(article, line, value)
                } else {
                  note(article, line, paste0("The string \"", value, "\" cannot be checked. Pass the fit as a literal, file = \"fits/<name>\", so that the build can check it."))
                }
              }
            }
          }

          fit_file <- function(fit) {
            file.path(articles_dir, if (identical(tools::file_ext(fit), "rds")) fit else paste0(fit, ".rds"))
          }
          readable <- list()
          for (fit in unique(references$fit)) {
            path <- fit_file(fit)
            readable[[fit]] <- if (!file.exists(path)) {
              "is not in the article-fits release"
            } else {
              tryCatch({ readRDS(path); NULL }, error = function(e) conditionMessage(e), warning = function(w) conditionMessage(w))
            }
          }
          for (k in seq_len(nrow(references))) {
            reason <- readable[[references$fit[k]]]
            if (!is.null(reason)) {
              note(references$article[k], references$line[k],
                   paste0(basename(references$article[k]), " loads ", references$fit[k], ", which ", if (grepl("^is not", reason)) reason else paste0("cannot be read (", reason, ")"), ". Upload it to the article-fits release before the site is built."))
            }
          }

          for (k in seq_len(nrow(problems))) {
            cat(sprintf("::error file=%s,line=%d::%s\n", problems$article[k], problems$line[k], problems$message[k]))
          }
          cat(sprintf("Checked %d fit references in %d articles; %d problems\n", nrow(references), length(articles), nrow(problems)))
          if (nrow(problems) > 0L) quit(save = "no", status = 1L)

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
