# Runs tests/local, the tests that sample with a real backend (ADR 0004),
# once a week and on demand, so they cannot rot unnoticed. Not a required
# check: a failure here is a signal to look, not a blocked merge.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

name: local-tests

jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
            devtools
            withr
            dplyr
            here
            posterior
            testthat
            stan-dev/cmdstanr
            tidybayes
            ggplot2
            emmeans

      - name: Get latest CmdStan release
        id: cmdstan-version
        shell: bash
        run: |
          set +e
          response=$(curl -sSL --fail \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
            https://api.github.com/repos/stan-dev/cmdstan/releases/latest)
          curl_status=$?
          set -e
          if [ $curl_status -ne 0 ]; then
            echo "Failed to reach the GitHub API (curl exit ${curl_status})" >&2
            exit 1
          fi
          tag=$(echo "$response" | jq -r '.tag_name // empty')
          if [ -z "$tag" ]; then
            echo "Failed to determine the latest CmdStan release" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Locate CmdStan install path
        id: cmdstan-path
        run: |
          cat(sprintf("path=%s\n", cmdstanr::cmdstan_default_install_path()),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.cmdstan-path.outputs.path }}
          key: cmdstan-${{ runner.os }}-${{ steps.cmdstan-version.outputs.version }}

      - name: Set up CmdStan toolchain
        # cmdstanr 1.0 ignores fix and warns when it is TRUE
        run: cmdstanr::check_cmdstan_toolchain(fix = packageVersion("cmdstanr") < "0.99.0")
        shell: Rscript {0}

      - name: Build CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          cmdstanr::install_cmdstan(
            cores = parallel::detectCores(),
            version = "${{ steps.cmdstan-version.outputs.version }}"
          )
        shell: Rscript {0}

      - name: Run tests/local
        run: Rscript tests/local/run.R
