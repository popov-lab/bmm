url: https://venpopov.com/bmm/
template:
  bootstrap: 5
  math-rendering: mathjax

development:
  mode: auto

navbar:
  structure:
     left: [intro, reference, articles, changelog, develop, parameter_recovery, explorer]
  components:
     reference:
        text: Functions
        href: reference/index.html
     articles:
        text: Articles
        href: articles/index.html
     changelog:
        text: Changelog
        href: news/index.html
     develop:
        text: Develop
        href: https://venpopov.com/bmm/dev-notes/index.html
     # TODO: point at the bmmtools validation-card site once it is published
     parameter_recovery:
        text: Parameter recovery
        href: https://venpopov.com/bmm/parameter-recovery/index.html
     explorer:
        text: Model explorer
        href: https://www.gfrischkorn.org/bmm-explorer/



reference:
  - title: "About bmm"
    desc: "These pages provide a summary of the functionality available in bmm"
  - contents:
    - "bmm-package"
    - "bmm_models"
    - "bmm_options"
    - "bmm_setup"
  - title: "Fitting models"
    desc: "Main functions for model fitting"
  - contents:
    - "bmm"
    - "bmmformula"
    - "update.bmmfit"
    - "add_chains"
    - "summary.bmmfit"
    - "conditional_effects.bmmfit"
    - "emmeans-bmmfit"
    - "easystats-bmmfit"
    - "predicted-bmmfit"
    - "easystats-report-bmmfit"
    - "pp_check.bmmfit"
    - "ppp"
    - "posterior_epred.bmmfit"
  - title: "Model evaluation & post-processing"
    desc: "ROC/AUC, quantile-transformed ROC, and latent-distribution analysis for signal detection models"
  - contents:
    - "roc_sdt"
    - "roc_observed"
    - "auc_sdt"
    - "latent_sdt"
    - "sdt_thresholds"
    - "mratio"
    - "sdt_sensitivity"
    - "plot.bmm_sdt_roc"
    - "plot.bmm_sdt_auc"
    - "plot.bmm_sdt_latent"
  - title: "Extract model information"
    desc: "Utility functions for extracting default priors, generate stan code, stan data, etc."
  - contents:
    - has_keyword("extract_info")
  - title: "Specifying models"
    desc: "Functions for specifying which model to fit"
  - contents:
    - has_keyword("bmmodel")
  - title: "Distributions"
    desc: "Functions for special distributions"
  - contents:
    - has_keyword("distribution")
  - title: "Data, model and parameter transformations"
    desc: "Utility functions for transforming data and parameters"
  - contents:
    - has_keyword("transform")
    - flag_contaminant_rts
    - validate_fast_guesses
  - title: "Datasets"
    desc: "Available datasets for fitting the models"
  - contents:
    - has_keyword("dataset")
  - title: "Developers' corner"
    desc: "Functions to assist in developing new models"
  - contents:
    - has_keyword("developer")
 

articles:
  - title: Using the bmm package
    desc: >
       Guides to using various features of the **bmm** package
    contents:
     - articles/bmm_brms_to_bmm
     - articles/bmm_bmmformula
     - articles/bmm_extract_info
     - articles/bmm_hypothesis_testing
  - title: Continuous reproduction tasks
    desc: Fitting models to continuous reproduction tasks
    contents:
     - articles/bmm_vwm_crt
     - articles/bmm_mixture_models
     - articles/bmm_imm
     - articles/bmm_sdm_simple

  - title: Categorical decision tasks
    desc: Fitting models to categorical decision tasks (e.g. cued or free recall, n-AFC, etc)
    contents:
    - articles/bmm_m3
    - articles/bmm_mpt

  - title: Signal detection & recognition
    desc: Fitting signal detection models and analysing ROC/AUC
    contents:
    - articles/bmm_sdt
    - articles/bmm_sdt_dualprocess_metad

  - title: Evidence accumulation models
    desc: Fitting evidence accumulation models to response time and choice data
    contents:
    - articles/bmm_ezdm
    - articles/bmm_cswald
    - articles/bmm_ddm
    - articles/bmm_rt_contamination
